# Daily availabilities sync.
#
# Runs scripts/sync-availabilities.py against the AppFolio feed and commits the
# result straight to main. There is deliberately no pull request: main is not
# protected and there are no required checks, so a PR here is a formality with
# no gate — and the formality is where this process died. 102 sync PRs sat
# unmerged between May and October 2026.
#
# The script is the safety mechanism, not the PR. It refuses to publish and
# exits non-zero when the feed looks wrong (too few listings, rents that stop
# parsing, an unrecognised property, missing Quil placeholders), which fails
# this job and leaves main untouched. Watch the Actions tab, or turn on
# notifications for failed workflow runs.

name: Sync availabilities

on:
  schedule:
    # 16:12 UTC daily — roughly when the old sync used to land, so the leasing
    # team sees updates at the same time of day. Off the hour on purpose:
    # scheduled runs bunch up at :00 and get delayed.
    - cron: '12 16 * * *'
  workflow_dispatch:

concurrency:
  group: sync-availabilities
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Pull the latest AppFolio listings
        id: sync
        run: |
          set -o pipefail
          python3 -I scripts/sync-availabilities.py 2>&1 | tee sync-report.txt
          if [ -z "$(git status --porcelain index.html listings.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No listing changes today."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit to main
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html listings.json
          {
            echo "Update property availabilities from AppFolio"
            echo
            sed -n '/^ADDED/,/^result:/p' sync-report.txt
          } > commit-message.txt
          git commit -F commit-message.txt
          git push origin main

      # A push made with GITHUB_TOKEN does not trigger other workflows, so
      # deploy.yml will NOT fire for the commit above. Deploy from here
      # instead. The workspace already holds exactly what was committed, so
      # there is nothing to check out — and nothing that can go stale.
      - name: Deploy to Cloudflare Pages
        if: steps.sync.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=agm-availabilities

      - name: Summary
        if: always()
        run: |
          {
            echo '## Availabilities sync'
            echo
            if [ "${{ steps.sync.outputs.changed }}" = "true" ]; then
              echo 'Committed to main and deployed.'
            else
              echo 'No changes in the feed. Nothing committed.'
            fi
            echo
            echo '```'
            cat sync-report.txt 2>/dev/null || echo '(the sync failed before producing a report)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
